<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高雄建案地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body { margin: 0; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: #f7f5f0; color: #2b2b2b; }
  header { padding: 16px 20px; background: #1f2a36; color: #fff; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: 2px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .75; }
  #map { height: calc(100vh - 80px); }
</style>
</head>
<body>
<header>
  <h1>高雄建案地圖</h1>
  <p>資料來源：data/projects.json（改這個檔案，網站就會跟著變）</p>
</header>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // 地圖中心：高雄市
  const map = L.map('map').setView([22.68, 120.31], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  // 讀取資料檔，每個建案放一個標記
  fetch('data/projects.json')
    .then(r => r.json())
    .then(list => {
      list.forEach(p => {
        L.marker([p.lat, p.lng]).addTo(map).bindPopup(
          `<b>${p.name}</b><br>${p.district}｜${p.type}<br>${p.size}<br>均價 ${p.price} 萬/坪`
        );
      });
    });
</script>
</body>
</html>
